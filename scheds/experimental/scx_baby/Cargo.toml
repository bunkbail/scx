[package]
name = "scx_baby"
version = "1.1.4"
authors = ["bunkbail <nabildanial.93@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "An earliest-deadline-first sched_ext scheduler with warm seats and hybrid-tier compaction. https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

publish = false

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
libbpf-rs = "=0.27.2"
# Declared so that static musl builds can enable libbpf-sys vendored libelf
# and zlib features from the command line.
libbpf-sys = "=1.7.0"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.4" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.4" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }

[features]
enable_backtrace = []

[package.metadata.scx]
ci.use_clippy = true
